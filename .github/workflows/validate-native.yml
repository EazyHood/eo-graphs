name: Validate native graph regressions
on:
  push:
    branches: [validate-native-regressions-11]
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        issue: [83]
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 2
          persist-credentials: false
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '25'
      - name: Prove the failure and the fix
        env:
          ISSUE: ${{ matrix.issue }}
        run: |
          set -eu
          git worktree add --detach "$RUNNER_TEMP/candidate" HEAD^
          cd "$RUNNER_TEMP/candidate"
          PATCH="$GITHUB_WORKSPACE/.github/validation/$ISSUE.patch"
          git apply --include='tests/*' "$PATCH"
          if python3 "tests/check_$ISSUE.py"; then
            echo 'Regression unexpectedly passed on the unchanged base'
            exit 1
          fi
          rm "tests/check_$ISSUE.py"
          git apply "$PATCH"
          python3 "tests/check_$ISSUE.py"
          mkdir -p "$RUNNER_TEMP/native/cpp" "$RUNNER_TEMP/native/java"
          for source in src/cpp/*.cpp; do
            g++ "$source" -o "$RUNNER_TEMP/native/cpp/$(basename "$source" .cpp)"
          done
          javac -d "$RUNNER_TEMP/native/java" $(find src/java -name '*.java')
          git -c core.whitespace=cr-at-eol diff --check
