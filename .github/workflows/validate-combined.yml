name: Validate combined graph changes
on:
  push:
    branches: [validate-graphs-combined]
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '25'
      - name: Run all regression scripts
        run: |
          set -eu
          for script in tests/check_*.py; do
            echo "Running $script"
            python3 "$script"
          done
